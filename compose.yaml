# Stack dedicato di GIGI OS. Non dipende da altri stack e nessun altro stack dipende da questo:
# se GIGI OS è fermo, Jellyfin, Apollo, qBittorrent, Armony e Home Assistant continuano a funzionare.
name: gigi-os

x-hardening: &hardening
  image: gigi-os:${GIGI_VERSION:-0.2.0}
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  agent:
    <<: *hardening
    image: gigi-os-agent:${GIGI_VERSION:-0.2.0}
    build: { context: ., target: agent }
    container_name: gigi-agent
    command: ["node", "apps/agent/dist/index.js"]
    # Rete host SOLO per leggere i contatori delle interfacce dell'host: l'agent non apre alcuna porta.
    network_mode: host
    group_add: ["${DOCKER_GID:-128}", "${JOURNAL_GID:-999}"]
    # 384m: durante pull/up dei nuovi stack gira anche docker-compose (~60 MB)
    mem_limit: 384m
    cpus: 0.5
    environment:
      GIGI_AGENT_SOCKET: /run/gigi/agent.sock
      # Radici dove il wizard può creare stack (D-025); montate qui sotto con lo STESSO percorso
      GIGI_STACK_ROOTS: Stack=/opt/stacks
      GIGI_COMPOSE_BIN: /usr/local/bin/docker-compose
      GIGI_OS_RELEASE: /host/os-release
      GIGI_HOSTNAME_FILE: /host/hostname
      # statfs su un file del filesystem root restituisce lo spazio di "/" senza montare directory dell'host
      GIGI_DISKS: "Sistema (/)=/host/hostname"
      GIGI_CONTROL_ALLOW: ${GIGI_CONTROL_ALLOW:-*}
      GIGI_PROTECTED_CONTAINERS: gigi-agent,gigi-api,gigi-media,gigi-files
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gigi-run:/run/gigi
      - /etc/os-release:/host/os-release:ro
      - /etc/hostname:/host/hostname:ro
      # Stato dei servizi systemd in sola lettura, senza D-Bus (D-021): cgroup, file delle unità, journal
      - /sys/fs/cgroup:/host/cgroup:ro
      - /etc/systemd/system:/host/units/etc:ro
      - /run/systemd/generator:/host/units/run:ro
      - /usr/lib/systemd/system:/host/units/lib:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Aggiornamenti del sistema operativo (D-032), sola lettura: riepilogo di update-notifier, timestamp di apt, kernel installati
      - /var/lib/update-notifier:/host/update-notifier:ro
      - /var/lib/apt/periodic:/host/apt-periodic:ro
      - /boot:/host/boot:ro
      # Stack creati dal wizard: stesso percorso dell'host, così ./data nel compose diventa /opt/stacks/<nome>/data
      - /opt/stacks:/opt/stacks

  api:
    <<: *hardening
    build: { context: ., target: runtime }
    container_name: gigi-api
    command: ["node", "apps/api/dist/index.js"]
    # Rete host: i servizi da monitorare ascoltano anche su 127.0.0.1 (Navidrome, Jellyfin, Home Assistant).
    # L'API si lega SOLO all'IP LAN indicato in GIGI_BIND; l'accesso è governato da UFW.
    network_mode: host
    depends_on: [agent]
    mem_limit: 256m
    cpus: 1.0
    environment:
      GIGI_BIND: ${GIGI_BIND:-192.168.222.200}
      GIGI_PORT: ${GIGI_PORT:-8470}
      GIGI_DATA_DIR: /data
      GIGI_WEB_DIR: /app/apps/web/dist
      GIGI_AGENT_SOCKET: /run/gigi/agent.sock
      GIGI_MASTER_KEY_FILE: /secrets/master.key
      GIGI_TLS_CERT: /secrets/tls.crt
      GIGI_TLS_KEY: /secrets/tls.key
      NODE_EXTRA_CA_CERTS: /secrets/tls.crt
      GIGI_ALLOWED_TARGETS: ${GIGI_ALLOWED_TARGETS:-127.0.0.0/8,::1/128,192.168.222.0/24}
      GIGI_LOG_LEVEL: ${GIGI_LOG_LEVEL:-warn}
      GIGI_MEDIA_SCAN_MS: ${GIGI_MEDIA_SCAN_MS:-120000}
      GIGI_METRICS_DAYS: ${GIGI_METRICS_DAYS:-30}
      # Fuso orario per gli orari scelti dall'utente (backup, ore di silenzio, digest): senza, il container usa UTC
      TZ: ${GIGI_TZ:-Europe/Rome}
      # Versione in uso e repo GitHub delle release per il controllo aggiornamenti di GIGI OS (vuoto = nessun controllo)
      GIGI_VERSION: ${GIGI_VERSION:-0.2.0}
      GIGI_RELEASE_REPO: ${GIGI_RELEASE_REPO:-}
      GIGI_BACKUP_DIR: /backups
      GIGI_BACKUP_EXTRA: env=/backup-src/.env,compose.yaml=/backup-src/compose.yaml
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./backups:/backups
      - ./.env:/backup-src/.env:ro
      - ./compose.yaml:/backup-src/compose.yaml:ro
      # DNS reali dell'host (systemd-resolved) per la pagina Rete, in sola lettura
      - /run/systemd/resolve:/host/resolve:ro
      # Configurazioni di altri servizi per il backup, in sola lettura e limitate alle sottocartelle necessarie
      - /opt/docker/qbittorrent/config/qBittorrent:/backup-src/qbittorrent:ro
      - /opt/docker/jellyfin/config/config:/backup-src/jellyfin/config:ro
      - /opt/docker/jellyfin/config/root:/backup-src/jellyfin/root:ro
      - /opt/docker/jellyfin/config/plugins/configurations:/backup-src/jellyfin/plugins/configurations:ro
      - /opt/docker/jellyfin/config/data:/backup-src/jellyfin/data:ro
      - gigi-run:/run/gigi
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('https://'+process.env.GIGI_BIND+':'+process.env.GIGI_PORT+'/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  media:
    <<: *hardening
    image: gigi-os-media:${GIGI_VERSION:-0.2.0}
    build: { context: ., target: media }
    container_name: gigi-media
    command: ["node", "apps/media/dist/index.js"]
    # Rete host per raggiungere Jellyfin (127.0.0.1:8096) e qBittorrent; nessuna porta in ascolto.
    network_mode: host
    depends_on: [agent]
    mem_limit: 256m
    cpus: 1.0
    environment:
      GIGI_MEDIA_SOCKET: /run/gigi/media.sock
      GIGI_DATA_DIR: /data
      # Librerie Jellyfin esistenti (verificate il 2026-10-15): non viene creata alcuna nuova tassonomia
      GIGI_MEDIA_LIBRARIES: movies=/srv/media/Film,series=/srv/media/SerieTV,animeMovies=/srv/media/Anime/Film,animeSeries=/srv/media/Anime/Serie
    volumes:
      # /srv come UNICO mount: gli hardlink tra downloads e media funzionano solo nello stesso mount.
      # Il codice non elimina, non sposta e non sovrascrive mai file (vedi DECISIONS D-011).
      - /srv:/srv
      - ./data/media:/data
      - gigi-run:/run/gigi

  files:
    <<: *hardening
    container_name: gigi-files
    command: ["node", "apps/files/dist/index.js"]
    # Nessuna rete: lavora solo sul filesystem e sul socket Unix condiviso con gigi-api.
    network_mode: none
    depends_on: [agent]
    mem_limit: 128m
    cpus: 0.5
    environment:
      GIGI_FILES_SOCKET: /run/gigi/files.sock
      GIGI_FILES_ROOTS: Download=/srv/downloads,Media=/srv/media
      GIGI_PASSWD_FILE: /host/passwd
    volumes:
      # /srv intero per consentire spostamenti e hardlink tra Download e Media (stesso mount);
      # l'accesso è comunque confinato alle radici in GIGI_FILES_ROOTS.
      - /srv:/srv
      - /etc/passwd:/host/passwd:ro
      - gigi-run:/run/gigi

volumes:
  gigi-run:
