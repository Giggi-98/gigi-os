# Release: a ogni tag vX.Y.Z costruisce le immagini per amd64 e arm64 e le pubblica su GHCR (D-034).
# Le immagini si chiamano ghcr.io/<proprietario in minuscolo>/gigi-os, gigi-os-agent e gigi-os-media; per usarle:
# GIGI_IMAGE_PREFIX=ghcr.io/<proprietario>/ e GIGI_VERSION=X.Y.Z nel file .env.
# Si può avviare anche a mano (Actions → Release → Run workflow) per un tag già pubblicato: usa il codice del tag
# e questa versione del workflow.
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da pubblicare (es. v0.3.1)'
        required: true
permissions:
  contents: write
  packages: write
jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      version: ${{ steps.m.outputs.version }}
      owner: ${{ steps.m.outputs.owner }}
    steps:
      - id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag non valido: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}
      - id: m
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          v="${TAG#v}"
          p="$(node -p 'require("./package.json").version')"
          [ "$v" = "$p" ] || { echo "::error::Il tag $TAG non coincide con la versione di package.json ($p)"; exit 1; }
          # GHCR accetta solo nomi in minuscolo
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          { echo "tag=$TAG"; echo "version=$v"; echo "owner=$owner"; } >> "$GITHUB_OUTPUT"

  images:
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      matrix:
        include:
          - target: runtime
            name: gigi-os
          - target: agent
            name: gigi-os-agent
          - target: media
            name: gigi-os-media
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIGI_VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/${{ matrix.name }}:${{ needs.meta.outputs.version }}
            ghcr.io/${{ needs.meta.outputs.owner }}/${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    runs-on: ubuntu-latest
    needs: [meta, images]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Note della release dal CHANGELOG
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Release $V" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: GIGI OS ${{ needs.meta.outputs.version }}
          body_path: notes.md
