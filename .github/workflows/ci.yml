# Test, controlli dei tipi e build delle immagini a ogni push e pull request (D-034). Nessuna pubblicazione.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      # Vulnerabilità note nelle dipendenze di produzione (soglia: alta)
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      # Ogni immagine va scansionata anche se un'altra fallisce
      fail-fast: false
      matrix:
        target: [runtime, agent, media]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} (amd64, senza push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: gigi-os-ci-${{ matrix.target }}:test
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Scansione vulnerabilità (Trivy)
        # Fissato al commit della v0.36.0: i tag di un'azione di terze parti si possono spostare
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gigi-os-ci-${{ matrix.target }}:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: '0'
      # Ogni vulnerabilità diventa un'annotazione (pubblica, leggibile senza accedere ai log); fallisce se ce n'è almeno una
      - name: Esito della scansione
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("trivy.json", "utf8"));
            const v = (r.Results ?? []).flatMap((t) => (t.Vulnerabilities ?? []).map((x) => ({ ...x, target: t.Target })));
            for (const x of v.slice(0, 40)) console.log(`::error title=${x.Severity} ${x.VulnerabilityID}::${x.PkgName} ${x.InstalledVersion} → ${x.FixedVersion} (${x.target})`);
            console.log(`${v.length} vulnerabilità critiche o alte con correzione disponibile`);
            process.exit(v.length ? 1 : 0);
          '
